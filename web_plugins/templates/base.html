<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}data-logger{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@5.15.4/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css">
</head>
<body class="hold-transition sidebar-mini">
<div class="wrapper">
  <nav class="main-header navbar navbar-expand navbar-white navbar-light">
    <ul class="navbar-nav">
      <li class="nav-item">
        <a class="nav-link" data-widget="pushmenu" href="#" role="button"><i class="fas fa-bars"></i></a>
      </li>
    </ul>
    <span class="navbar-text ml-2">{{ site_name }}</span>
    <span class="navbar-text ml-auto mr-3 small {% if tb_ok %}text-success{% else %}text-warning{% endif %}">
      {% if tb_ok %}ThingsBoard conectado{% else %}ThingsBoard no disponible — datos vacíos{% endif %}
    </span>
  </nav>
  <aside class="main-sidebar sidebar-dark-primary elevation-4">
    <a href="/" class="brand-link"><span class="brand-text font-weight-light">data-logger</span></a>
    <div class="sidebar">
      <nav class="mt-2">
        <ul class="nav nav-pills nav-sidebar flex-column" data-widget="treeview">
          <li class="nav-item">
            <a href="/produccion" class="nav-link {% if request.path=='/produccion' %}active{% endif %}">
              <i class="nav-icon fas fa-industry"></i><p>Producción</p>
            </a>
          </li>
          <li class="nav-item">
            <a href="/clima" class="nav-link {% if request.path=='/clima' %}active{% endif %}">
              <i class="nav-icon fas fa-cloud-sun"></i><p>Clima</p>
            </a>
          </li>
          <li class="nav-item">
            <a href="/calidad" class="nav-link {% if request.path=='/calidad' %}active{% endif %}">
              <i class="nav-icon fas fa-flask"></i><p>Calidad</p>
            </a>
          </li>
        </ul>
      </nav>
    </div>
  </aside>
  <div class="content-wrapper">
    <section class="content-header">
      <div class="container-fluid"><h1 class="m-0">{% block heading %}{% endblock %}</h1></div>
    </section>
    <section class="content">
      <div class="container-fluid">
        {% block content %}{% endblock %}
      </div>
    </section>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/js/adminlte.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
