# data-logger — puente a ThingsBoard Community Edition.
# Basado en la guía oficial (imagen tb-node:4.3.1.3 + postgres:18, cola in-memory).
# https://thingsboard.io/docs/user-guide/install/docker/
#
# Postgres NO se publica en el host (evita chocar con otras bases en :5432).
# HTTP/MQTT sí: 8080 y 1883, configurables por .env.

services:
  postgres:
    restart: always
    image: "postgres:18"
    environment:
      POSTGRES_DB: thingsboard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - data-logger-tb-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d thingsboard"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  thingsboard-ce:
    restart: always
    image: "thingsboard/tb-node:4.3.1.3"
    ports:
      - "${TB_HTTP_PORT:-8080}:8080"
      - "${TB_MQTT_PORT:-1883}:1883"
      - "${TB_MQTTS_PORT:-8883}:8883"
      - "${TB_EDGE_PORT:-7070}:7070"
      - "${TB_COAP_PORT:-5683}-5688:5683-5688/udp"
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"
    environment:
      TB_SERVICE_ID: tb-ce-node
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/thingsboard
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  data-logger-tb-postgres-data:
    name: data-logger-tb-postgres-data
    driver: local
